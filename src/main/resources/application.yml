spring:
  application:
    name: fretai
  datasource:
    # Valores padrão servem para o docker-compose local; em produção vêm de variáveis de ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fretai}
    username: ${DB_USER:fretai}
    password: ${DB_PASSWORD:fretai}
  jpa:
    # O banco é descrito pelas migrations do Flyway; o Hibernate só confere se bate.
    hibernate:
      ddl-auto: validate
      naming:
        # Colunas de @Embedded ganham prefixo: ponto_coleta_cep, ponto_entrega_cep...
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
    # Sem sessão aberta durante a renderização da resposta: toda consulta acontece no service.
    open-in-view: false
    properties:
      # Listas de fretes carregam veículos/carrocerias aceitos em lotes, não um SELECT por frete.
      hibernate.default_batch_fetch_size: 50
  jackson:
    deserialization:
      # Jackson 3 recusa por padrão booleano omitido no JSON; aqui, omitido = false.
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      # Documentos e fotos de canhoto: foto de celular cabe com folga.
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    web:
      pageable:
        # Ninguém baixa a base inteira numa requisição.
        max-page-size: 100
  flyway:
    # db/migration roda em qualquer banco (inclusive o H2 dos testes).
    # db/vendor/postgresql só no PostgreSQL: PostGIS, colunas geography e índices espaciais.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

fretai:
  jwt:
    # Pelo menos 32 bytes. Sem ele, um segredo aleatório é gerado a cada subida.
    segredo: ${FRETAI_JWT_SEGREDO:}
    validade-acesso: 15m
    validade-refresh: 30d
  google:
    # Client ID OAuth (tipo "Aplicativo da Web") do Google Cloud. Sem ele, entrar com Google responde 422.
    client-id: ${FRETAI_GOOGLE_CLIENT_ID:}
  login:
    # Depois de 5 senhas erradas para o mesmo e-mail e IP, espera até 15 minutos.
    maximo-falhas: 5
    janela: 15m
  # Primeiro administrador; sem as três variáveis, nenhum é criado.
  admin:
    email: ${FRETAI_ADMIN_EMAIL:}
    senha: ${FRETAI_ADMIN_SENHA:}
    cpf: ${FRETAI_ADMIN_CPF:}
  arquivos:
    # local (disco, padrão) ou s3 (S3/MinIO).
    provedor: ${FRETAI_ARQUIVOS_PROVEDOR:local}
    # Por quanto tempo vale o link de um documento.
    validade-link: 10m
    tamanho-maximo-bytes: 10485760
    # Assina os links do provedor local. Sem ele, um segredo aleatório por subida (links caem ao reiniciar).
    segredo: ${FRETAI_ARQUIVOS_SEGREDO:}
    local:
      diretorio: ${FRETAI_ARQUIVOS_DIR:./dados/arquivos}
      url-base: ${FRETAI_URL_PUBLICA:http://localhost:8080}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      # Endereço que vai nos links assinados; só muda quando a API fala com o S3 por uma rede interna.
      endpoint-publico: ${S3_ENDPOINT_PUBLICO:${S3_ENDPOINT:http://localhost:9000}}
      regiao: ${S3_REGIAO:us-east-1}
      bucket: ${S3_BUCKET:fretai-documentos}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      criptografia-servidor: ${S3_CRIPTOGRAFIA:false}
  # Notificações. Desligado = vão para o log (LogNotificador).
  whatsapp:
    habilitado: ${WHATSAPP_HABILITADO:false}
    url: ${WHATSAPP_URL:https://graph.facebook.com/v21.0}
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  retorno:
    # Sugestões de frete de volta: saindo a até 150 km do destino do motorista.
    raio-km: 150
  canhoto:
    # O GPS do canhoto precisa estar a até 500 m do endereço de entrega.
    raio-maximo-km: 0.5
  pagamento:
    # Prazo do Pix gerado no aceite.
    prazo-cobranca: 2d
    # Depois do canhoto, quanto tempo o recebedor tem para contestar antes de o saldo sair.
    janela-contestacao: ${FRETAI_JANELA_CONTESTACAO:24h}
    # Com que frequência o job procura saldos prontos para liberar.
    intervalo-liberacao: ${FRETAI_INTERVALO_LIBERACAO:5m}
    fake:
      # PSP de mentira (desenvolvimento): não é segredo, não vale fora da sua máquina.
      webhook-token: ${FRETAI_FAKE_WEBHOOK_TOKEN:fake-dev}
    # Só com o profile "asaas". A URL precisa ser a do sandbox, senão a aplicação não sobe.
    asaas:
      url: ${ASAAS_URL:https://api-sandbox.asaas.com/v3}
      chave: ${ASAAS_CHAVE:}
      webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
  preco:
    # Alerta de "fretão": R$/km acima de 2× a média de fretes parecidos.
    fator-suspeita: 2.0
    # Com menos fretes parecidos que isto, não há média confiável e o alerta não dispara.
    amostra-minima: 5
    # Parecidos = mesma UF de origem e de destino, distância até 30% diferente, publicados nos últimos 180 dias.
    janela-media: 180d
    tolerancia-distancia: 0.3
  frete:
    # Percentual somado ao valor oferecido quando a coleta cai em feriado nacional (20 = 20%).
    adicional-feriado-percentual: 20
  # CEP: ViaCEP primeiro, BrasilAPI de reserva.
  viacep:
    url: https://viacep.com.br
    timeout: 3s
  # BrasilAPI: CEP (reserva), CNPJ e feriados. Pública, sem chave.
  brasilapi:
    url: https://brasilapi.com.br
    timeout: 5s
  # Geocodificação (endereço → coordenadas). A política do serviço público exige
  # um User-Agent com contato e no máximo 1 requisição por segundo.
  nominatim:
    url: https://nominatim.openstreetmap.org
    timeout: 5s
    user-agent: Fretai/0.1 (${NOMINATIM_CONTATO:https://github.com/celoramos/Fretai})
    intervalo-minimo: 1s
  # Distância de estrada. Sem chave, a distância é estimada pela linha reta.
  # Chave gratuita em https://graphhopper.com/dashboard/#/register
  graphhopper:
    url: https://graphhopper.com/api/1
    timeout: 5s
    chave: ${GRAPHHOPPER_CHAVE:}
    perfil: car

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

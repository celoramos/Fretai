spring:
  application:
    name: fretai
  datasource:
    # Valores padrão servem para o docker-compose local; em produção vêm de variáveis de ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fretai}
    username: ${DB_USER:fretai}
    password: ${DB_PASSWORD:fretai}
  jpa:
    # O banco é descrito pelas migrations do Flyway; o Hibernate só confere se bate.
    hibernate:
      ddl-auto: validate
      naming:
        # Colunas de @Embedded ganham prefixo: ponto_coleta_cep, ponto_entrega_cep...
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
    # Sem sessão aberta durante a renderização da resposta: toda consulta acontece no service.
    open-in-view: false
    properties:
      # Listas de fretes carregam veículos/carrocerias aceitos em lotes, não um SELECT por frete.
      hibernate.default_batch_fetch_size: 50
  jackson:
    deserialization:
      # Jackson 3 recusa por padrão booleano omitido no JSON; aqui, omitido = false.
      fail-on-null-for-primitives: false
  data:
    web:
      pageable:
        # Ninguém baixa a base inteira numa requisição.
        max-page-size: 100
  flyway:
    # db/migration roda em qualquer banco (inclusive o H2 dos testes).
    # db/vendor/postgresql só no PostgreSQL: PostGIS, colunas geography e índices espaciais.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

fretai:
  jwt:
    # Pelo menos 32 bytes. Sem ele, um segredo aleatório é gerado a cada subida.
    segredo: ${FRETAI_JWT_SEGREDO:}
    validade-acesso: 15m
    validade-refresh: 30d
  login:
    # Depois de 5 senhas erradas para o mesmo e-mail e IP, espera até 15 minutos.
    maximo-falhas: 5
    janela: 15m
  # Primeiro administrador; sem as três variáveis, nenhum é criado.
  admin:
    email: ${FRETAI_ADMIN_EMAIL:}
    senha: ${FRETAI_ADMIN_SENHA:}
    cpf: ${FRETAI_ADMIN_CPF:}
  frete:
    # Percentual somado ao valor oferecido quando a coleta cai em feriado nacional (20 = 20%).
    adicional-feriado-percentual: 20
  # CEP: ViaCEP primeiro, BrasilAPI de reserva.
  viacep:
    url: https://viacep.com.br
    timeout: 3s
  # BrasilAPI: CEP (reserva), CNPJ e feriados. Pública, sem chave.
  brasilapi:
    url: https://brasilapi.com.br
    timeout: 5s
  # Geocodificação (endereço → coordenadas). A política do serviço público exige
  # um User-Agent com contato e no máximo 1 requisição por segundo.
  nominatim:
    url: https://nominatim.openstreetmap.org
    timeout: 5s
    user-agent: Fretai/0.1 (${NOMINATIM_CONTATO:https://github.com/celoramos/Fretai})
    intervalo-minimo: 1s
  # Distância de estrada. Sem chave, a distância é estimada pela linha reta.
  # Chave gratuita em https://graphhopper.com/dashboard/#/register
  graphhopper:
    url: https://graphhopper.com/api/1
    timeout: 5s
    chave: ${GRAPHHOPPER_CHAVE:}
    perfil: car

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

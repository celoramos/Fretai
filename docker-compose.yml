# Banco local para desenvolvimento: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fretai
      POSTGRES_USER: fretai
      POSTGRES_PASSWORD: fretai
    ports:
      - "5432:5432"
    volumes:
      - fretai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fretai -d fretai"]
      interval: 5s
      retries: 10

volumes:
  fretai-pgdata:
